[package]
name = "dayrecap"
version = "0.1.0"
edition = "2021"
description = "Free, lightweight system-tray app that records what you work on and writes AI hourly/daily reports"
license = "MIT"

[dependencies]
# System tray icon + native menu (maintained by the Tauri team)
tray-icon = "0.19"
# Minimal event loop that pumps OS messages for the tray
tao = "0.30"
# Native, GPU-light chat window (no WebView) — only loaded in the `--chat` process
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
# Small blocking HTTP client (no async runtime => low RAM)
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
directories = "5"
flate2 = "1"
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(not(windows))'.dependencies]
active-win-pos-rs = "0.8"
user-idle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[profile.release]
opt-level = "s"     # small binary, still fast
lto = true
codegen-units = 1
strip = true
